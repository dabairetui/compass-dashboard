<title>小小白·模拟账户</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 布局：单列控制台。顶部状态条 → 四账户卡片 → 运行记录 → 历史回放（明确标注非正式业绩） */
:root{
  --bg:#F3F6F9; --surface:#FFFFFF; --ink:#16202E; --muted:#5B6778; --line:#DCE2EA;
  --accent:#0E6B8C; --up:#C8322B; --down:#1B8A57; --warn:#B26A00; --bad:#B3261E; --ok:#1B8A57;
  --c1:#0E6B8C; --c2:#8A94A4; --c3:#C98A1B;
  --font-ui:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --font-head:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F141B; --surface:#171E27; --ink:#E6EBF2; --muted:#93A0B2; --line:#283240;
  --accent:#4DB3D6; --up:#F0625A; --down:#3FBF85; --warn:#E3A13B; --bad:#F2766E; --ok:#3FBF85;
  --c1:#4DB3D6; --c2:#7E8A9B; --c3:#E3A13B; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F141B; --surface:#171E27; --ink:#E6EBF2; --muted:#93A0B2; --line:#283240;
  --accent:#4DB3D6; --up:#F0625A; --down:#3FBF85; --warn:#E3A13B; --bad:#F2766E; --ok:#3FBF85;
  --c1:#4DB3D6; --c2:#7E8A9B; --c3:#E3A13B; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);line-height:1.55;font-size:14px;margin:0;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin-inline:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.wrap>*{min-width:0}
.wrap{scroll-margin-top:70px}
h1{font-family:var(--font-head);font-size:1.5rem;margin:0;text-wrap:balance}
h2{font-family:var(--font-head);font-size:1.1rem;margin:0}
h3{font-size:.8rem;letter-spacing:.08em;color:var(--muted);margin:0 0 6px;font-weight:600}
p{margin:0}.muted{color:var(--muted)}.small{font-size:.8rem}
.bar{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:.75rem;border:1px solid currentColor}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;min-width:0}
.card>*{min-width:0}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:baseline}
.big{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.kv div{min-width:0}.kv b{display:block;font-size:1rem;font-variant-numeric:tabular-nums}
.kv span{font-size:.75rem;color:var(--muted)}
.pos{color:var(--up)}.neg{color:var(--down)}   /* 红涨绿跌 */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.82rem}
th,td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:600}
svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:3px;margin-right:5px;vertical-align:middle}
details summary{cursor:pointer;color:var(--accent);font-size:.85rem}
.note{border-left:3px solid var(--warn);padding:6px 10px;background:var(--surface);font-size:.82rem}
.tabs{max-width:760px;margin:0 auto 14px;display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px}
.tabs a{flex:1;text-align:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);text-decoration:none;font-weight:600;font-size:.9rem}
.tabs a[aria-current="page"]{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.md p{margin:0 0 6px}.md ul{margin:0;padding-left:18px}.md li{margin:2px 0;font-size:.85rem}

/* VCP 页 */
.vh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px}
.vpills{display:flex;flex-wrap:wrap;gap:6px}.vpills .pill{padding:2px 10px}
.hero .hnav{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.hero .hnav span{color:var(--muted);font-size:.8rem}
.hero .hnav b{font-size:2rem;font-variant-numeric:tabular-nums;letter-spacing:-.01em}.hero .hnav em{font-style:normal;font-weight:700;font-size:1.05rem}
.hero .kv{grid-template-columns:repeat(3,minmax(0,1fr))}.hero .kv b{font-size:.95rem}
.plan{margin:0;padding-left:18px}.plan li{margin:4px 0}
.tsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tsum div{border-radius:8px;padding:8px 10px;background:var(--bg);border-left:4px solid var(--c2)}
.tsum b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums}.tsum span{font-size:.75rem;color:var(--muted)}
.tsum .t1{border-color:var(--up)}.tsum .t2{border-color:var(--warn)}.tsum .t3{border-color:var(--c2)}
.flt{display:flex;gap:6px;flex-wrap:wrap}.flt button{font:inherit;font-size:.8rem;padding:4px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.flt button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:0}
.rk{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto auto;grid-template-areas:"no nm ms tc" "no st st st";gap:2px 10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.rk:last-child{border-bottom:0}
.rk .no{grid-area:no;font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);text-align:center;align-self:start;padding-top:2px}
.rk.t1 .no{color:var(--up)}.rk.t2 .no{color:var(--warn)}
.rk .nm{grid-area:nm;min-width:0}.rk .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rk small{color:var(--muted);font-size:.72rem}
.rk .ms{grid-area:ms;text-align:right;font-variant-numeric:tabular-nums}.rk .ms span{display:block}.rk .ms i{font-style:normal;font-size:.78rem}
.rk .st{grid-area:st;font-size:.78rem;color:var(--muted)}
.tc{grid-area:tc;font-size:.72rem;padding:1px 8px;border-radius:10px;border:1px solid currentColor;white-space:nowrap}
.tc.t1{color:var(--up)}.tc.t2{color:var(--warn)}.tc.t3,.tc.t4{color:var(--c2)}
.rk.strong .st{color:var(--accent)}
.fold{padding:0}.fold summary{padding:12px 14px;font-family:var(--font-head);font-size:1rem;color:var(--ink);list-style:none;display:flex;justify-content:space-between}
.fold summary::after{content:"展开";font-family:var(--font-ui);font-size:.78rem;color:var(--accent)}.fold details[open] summary::after{content:"收起"}
.fold summary::-webkit-details-marker{display:none}.fb{padding:0 14px 14px}
.more{font:inherit;font-size:.85rem;padding:8px;border:1px dashed var(--line);border-radius:8px;background:transparent;color:var(--accent);cursor:pointer}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:6px 0}.prog i{display:block;height:100%;background:var(--accent)}
</style>
<nav class="tabs" aria-label="账户切换"><a href="#" data-view="app">四账户（罗盘）</a><a href="#vcp" data-view="vcp">VCP 突破</a></nav>
<div class="wrap" id="app"><h1>小小白·罗盘系统</h1><p class="muted">正在读取账本数据……</p></div>
<div class="wrap" id="vcp" hidden><h1>小小白·VCP突破模拟账户</h1><p class="muted">正在读取账本数据……</p></div>
<script src="data/dashboard.js"></script>
<script src="data/vcp.js"></script>
<script>
(function(){
const $=(h)=>{const d=document.createElement("div");d.innerHTML=h;return d.firstElementChild};
const esc=(s)=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f2=(x)=>Number(x).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(x,d=2)=>(x>=0?"+":"")+(x*100).toFixed(d)+"%";
const cls=(x)=>x>0?"pos":x<0?"neg":"";
const app=document.getElementById("app");
const D=window.DASH;
if(!D||!D.accounts||!D.accounts.length){
  app.innerHTML='<h1>小小白·罗盘系统</h1><div class="bar"><span class="pill warn">尚未初始化</span><span>账本里还没有任何账户数据，所以没有任何净值、持仓或成交可以显示。</span></div><p class="muted">四个模拟账户（A股稳健、A股进攻、美股稳健、美股进攻）会在 Mac 上首次运行时建账，之后每个交易日收盘后更新本页。全部为模拟交易。</p>';
  return;
}
const now=new Date(D.generated_at);
function ageDays(dstr){return Math.floor((now-new Date(dstr+"T00:00:00Z"))/86400000)}
function chart(a){
  const h=a.history; if(h.length<2) return '<p class="muted small">净值曲线至少要两个交易日才能画出。</p>';
  const W=640,H=190,L=44,R=10,T=10,B=22;
  const vals=h.flatMap(r=>[r[1],a.shadow_started?r[2]:r[1],a.shadow_started?r[3]:r[1]]);
  let lo=Math.min(...vals),hi=Math.max(...vals); const pad=(hi-lo)*.1||.01; lo-=pad;hi+=pad;
  const x=i=>L+(W-L-R)*i/(h.length-1), y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const line=(k,c,dash)=>'<polyline fill="none" stroke="'+c+'" stroke-width="2" '+(dash?'stroke-dasharray="4 3" ':'')+'points="'+h.map((r,i)=>x(i).toFixed(1)+","+y(r[k]).toFixed(1)).join(" ")+'"/>';
  let g="";for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3;g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+v.toFixed(3)+'</text>'}
  g+='<text x="'+L+'" y="'+(H-5)+'" font-size="11" fill="var(--muted)">'+h[0][0]+'</text><text x="'+(W-R)+'" y="'+(H-5)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+h[h.length-1][0]+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="净值曲线">'+g+(a.shadow_started?line(3,"var(--c3)",1)+line(2,"var(--c2)",1):"")+line(1,"var(--c1)")+'</svg>'+
   '<div class="legend"><span><i style="background:var(--c1)"></i>本账户</span>'+(a.shadow_started?'<span><i style="background:var(--c2)"></i>'+esc(a.benchmark_name)+'</span><span><i style="background:var(--c3)"></i>对照组（同资产不择时）</span>':'')+'</div>';
}
function posTable(a){
  if(!a.positions.length) return '<p class="muted small">当前全部是现金，没有持仓。</p>';
  return '<div class="tw"><table><tr><th>持仓</th><th>份额</th><th>现价</th><th>市值</th><th>占比</th><th>浮盈亏</th></tr>'+a.positions.map(p=>'<tr><td>'+esc(p.name)+(p.is_cash?' <span class="muted">(现金类)</span>':'')+'</td><td>'+p.shares.toLocaleString()+'</td><td>'+p.price+'</td><td>'+f2(p.value)+'</td><td>'+(p.weight*100).toFixed(1)+'%</td><td class="'+cls(p.pnl)+'">'+pct(p.pnl_pct)+'</td></tr>').join("")+'<tr><td>现金</td><td></td><td></td><td>'+f2(a.cash)+'</td><td>'+(a.cash/a.nav*100).toFixed(1)+'%</td><td></td></tr></table></div>';
}
function orders(a){
  if(!a.pending.length) return '<p class="muted small">没有待成交订单。</p>';
  return '<div class="tw"><table><tr><th>编号</th><th>方向</th><th>标的</th><th>份额</th><th>参考价</th></tr>'+a.pending.map(o=>'<tr><td>'+o.id+'</td><td class="'+(o.side=="BUY"?"pos":"neg")+'">'+(o.side=="BUY"?"买入":"卖出")+'</td><td>'+esc(o.name)+'</td><td>'+o.shares.toLocaleString()+(o.sell_all?'（清仓）':'')+'</td><td>'+o.ref_price+'</td></tr>').join("")+'</table></div><p class="muted small">订单在下一个收盘价成交；A股 T+1 规则下当日买入的份额次日才可卖出（本系统调仓按收盘撮合，不做日内买卖）。</p>';
}
function fills(a){
  if(!a.fills.length) return '<p class="muted small">还没有成交。</p>';
  return '<div class="tw"><table><tr><th>日期</th><th>方向</th><th>标的</th><th>份额</th><th>成交价</th><th>费用</th></tr>'+a.fills.slice(-12).reverse().map(r=>'<tr><td>'+r.date+'</td><td>'+(r.side=="BUY"?"买入":"卖出")+'</td><td>'+esc(r.name)+'</td><td>'+r.shares.toLocaleString()+'</td><td>'+Number(r.price).toFixed(4)+'</td><td>'+f2(r.fee)+'</td></tr>').join("")+'</table></div>';
}
function why(a){
  const d=a.detail||{};let rows="";
  if(d.kind=="allocation") rows=d.rows.map(r=>'<tr><td>'+esc(D.names[r.symbol])+'</td><td>'+(r.base*100).toFixed(0)+'%</td><td>'+r.score.toFixed(2)+'</td><td>'+(r.weight*100).toFixed(1)+'%</td></tr>').join("");
  else if(d.kind=="rotation") rows=d.rows.slice().sort((p,q)=>(p.rank||99)-(q.rank||99)).map(r=>'<tr><td>'+esc(D.names[r.symbol])+'</td><td>'+(r.mom==null?"—":pct(r.mom,1))+'</td><td>'+r.score.toFixed(2)+'</td><td>'+(r.weight?(r.weight*100).toFixed(0)+'%':(r.eligible?'候补':'不入围'))+'</td></tr>').join("");
  else if(d.kind=="levered_trend") rows=d.legs.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+esc(D.names[r.signal])+'</td><td>'+r.score.toFixed(2)+'</td><td>'+({lev:"杠杆产品",base:"本体",none:"空仓"})[r.gear]+'</td></tr>').join("");
  const head=d.kind=="allocation"?'<th>资产</th><th>基准权重</th><th>趋势得分</th><th>目标权重</th>':d.kind=="rotation"?'<th>资产</th><th>动量</th><th>趋势得分</th><th>目标</th>':'<th>腿</th><th>信号资产</th><th>趋势得分</th><th>档位</th>';
  return rows?'<details><summary>'+a.ref_month+' 月末信号的依据</summary><div class="tw"><table><tr>'+head+'</tr>'+rows+'</table></div></details>':"";
}
function card(a){
  const bm=a.shadow_started?(a.unit/a.bench_unit-1):null;
  const brakeCls=a.brake==0?"ok":a.brake==1?"warn":"bad";
  return '<section class="card" id="'+a.id+'"><div class="head"><h2>'+esc(a.name)+'</h2><span class="muted small">'+esc(a.currency)+' · 初始 '+f2(a.capital)+'</span></div>'+
   '<div><div class="big '+cls(a.ret)+'">'+pct(a.ret)+'</div><span class="muted small">净资产 '+f2(a.nav)+' '+a.currency+' · 单位净值 '+a.unit.toFixed(4)+'</span></div>'+
   '<div class="kv"><div><b class="'+cls(-a.drawdown)+'">'+(a.drawdown*100).toFixed(2)+'%</b><span>当前回撤</span></div><div><b>'+(a.max_drawdown*100).toFixed(2)+'%</b><span>历史最大回撤</span></div>'+
   '<div><b class="'+(bm==null?"":cls(bm))+'">'+(bm==null?"—":pct(bm))+'</b><span>相对基准超额</span></div><div><b><span class="pill '+brakeCls+'" style="font-size:.8rem;color:var(--'+(a.brake==0?'ok':a.brake==1?'warn':'bad')+')">'+esc(a.brake_name)+'</span></b><span>风控刹车</span></div></div>'+
   chart(a)+'<div><h3>当前持仓</h3>'+posTable(a)+'</div><div><h3>待成交订单</h3>'+orders(a)+'</div>'+why(a)+
   '<details><summary>最近成交与费用</summary>'+fills(a)+'<p class="muted small">累计费用 '+f2(a.stats.fees)+'，累计成交额 '+f2(a.stats.turnover)+'，累计分红 '+f2(a.stats.dividends)+'，成交 '+a.stats.trades+' 笔。</p></details></section>';
}
const mk=D.markets;
const lastD=[mk.CN.last_date,mk.US.last_date].filter(Boolean).sort().pop();
const stale=ageDays(lastD);
const lastRun=D.runs.length?D.runs[D.runs.length-1]:null;
let html='<div><h1>小小白·罗盘系统</h1><p class="muted small">全部为模拟交易，不连接券商，不涉及真实资金。引擎 '+esc(D.engine_version)+' · 章程 '+esc(D.charter_version)+'</p></div>';
html+='<div class="bar"><span>A股结算至 <b>'+mk.CN.last_date+'</b></span><span>美股结算至 <b>'+mk.US.last_date+'</b></span>'+
 '<span class="pill '+(D.ledger.ok?"ok":"bad")+'">账本'+(D.ledger.ok?"完整":"校验未通过")+'（'+D.ledger.records+' 条）</span>'+
 (lastRun?'<span class="pill '+(lastRun.status=="failed"?"bad":lastRun.status=="warn"?"warn":"ok")+'">最近运行：'+({ok:"成功",warn:"成功但有提示",failed:"失败",init:"首次建账",idle:"无新交易日"})[lastRun.status]+'</span>':'')+
 '<span class="muted small">页面生成 '+esc(D.generated_at.replace("T"," ").slice(0,16))+' UTC</span></div>';
if(stale>5) html+='<div class="note bad">账本已有 '+stale+' 天没有结算新交易日。可能是 Mac 没开机或网络故障，运行记录里有原因。</div>';
if(!D.ledger.ok) html+='<div class="note bad">账本哈希链校验未通过：'+esc(D.ledger.problems.join("；"))+'</div>';
if(D.frozen&&D.frozen.length) html+='<div class="note">有标的被冻结待核（疑似拆分或分红）：'+D.frozen.map(x=>esc(x.name)+"（"+esc(x.why)+"）").join("；")+'</div>';
html+=D.accounts.map(card).join("");
html+='<section class="card"><h2>运行记录</h2>'+(D.runs.length?'<div class="tw"><table><tr><th>时间(UTC)</th><th>状态</th><th>说明</th></tr>'+D.runs.slice().reverse().slice(0,15).map(r=>'<tr><td>'+esc(r.ts.replace("T"," ").slice(5,16))+'</td><td class="'+(r.status=="failed"?"bad":r.status=="warn"?"warn":"ok")+'">'+({ok:"成功",warn:"提示",failed:"失败",init:"建账",idle:"无新日"})[r.status]+'</td><td style="white-space:normal;text-align:left">'+esc([].concat(r.warnings||[],r.notes||[]).slice(0,3).join("；")||r.note||"")+'</td></tr>').join("")+'</table></div>':'<p class="muted">还没有运行记录。</p>')+'<p class="muted small">失败和警告原样保留，不会被覆盖。</p></section>';
if(D.replay&&D.replay.accounts){
  const R=D.replay.accounts;
  html+='<section class="card"><h2>历史回放（非正式业绩）</h2><div class="note">这是用过去的月末价格把同一套规则重走一遍，用来了解规则的脾气。规则是在看过这段历史之后才定下的，所以结果必然偏乐观，不能当作未来收益的依据。正式业绩只看上面的账户。</div><div class="tw"><table><tr><th>账户</th><th>区间</th><th>策略</th><th>回撤</th><th>对照</th><th>回撤</th><th>基准</th><th>回撤</th></tr>'+Object.values(R).map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+r.start+'→'+r.end+'</td><td class="'+cls(r.strategy.total)+'">'+pct(r.strategy.total,1)+'</td><td>'+(r.strategy.mdd*100).toFixed(1)+'%</td><td class="'+cls(r.control.total)+'">'+pct(r.control.total,1)+'</td><td>'+(r.control.mdd*100).toFixed(1)+'%</td><td class="'+cls(r.benchmark.total)+'">'+pct(r.benchmark.total,1)+'</td><td>'+(r.benchmark.mdd*100).toFixed(1)+'%</td></tr>').join("")+'</table></div><p class="muted small">回放简化：月末收盘价换仓，不含月内止损/降档/回撤刹车。</p></section>';
}
app.replaceChildren(...$("<div>"+html+"</div>").children);
})();

<script>
(function(){
const esc=(s)=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f2=(x)=>Number(x).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(x,d=2)=>(x>=0?"+":"")+(x*100).toFixed(d)+"%";
const cls=(x)=>x>0?"pos":x<0?"neg":"";
function md(t){let h="",inT=false,inL=false;for(const l of String(t||"").split("\n")){
  if(/^\|/.test(l)){if(/^\|[-| ]+\|$/.test(l))continue;const c=l.split("|").slice(1,-1).map(x=>esc(x.trim()));if(inL){h+="</ul>";inL=false}h+=(inT?"":'<div class="tw"><table>')+"<tr>"+c.map(x=>"<td>"+x+"</td>").join("")+"</tr>";inT=true;continue}
  if(inT){h+="</table></div>";inT=false}
  const e=esc(l).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  if(/^- /.test(l)){if(!inL){h+="<ul>";inL=true}h+="<li>"+e.slice(2)+"</li>";continue}
  if(inL){h+="</ul>";inL=false}
  if(/^## /.test(l))continue;else if(l.trim())h+="<p>"+e+"</p>"}
  return h+(inT?"</table></div>":"")+(inL?"</ul>":"")}
function chart(nav){
  if(nav.length<2)return '<p class="muted small">净值曲线至少要两个交易日才能画出。</p>';
  const a=nav.map(r=>100*(1+ +r.ret)),b=nav.map(r=>100*(1+ +r.bench_ret)),all=a.concat(b);
  const lo=Math.min(...all)-0.5,hi=Math.max(...all)+0.5,W=640,H=190,L=44,R=10,T=10,B=22,n=a.length-1;
  const x=i=>L+(W-L-R)*i/n,y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const pl=s=>s.map((v,i)=>x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ");
  let g="";for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3;g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+v.toFixed(1)+'</text>'}
  g+='<text x="'+L+'" y="'+(H-5)+'" font-size="11" fill="var(--muted)">'+nav[0].date+'</text><text x="'+(W-R)+'" y="'+(H-5)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+nav[n].date+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="账户净值与沪深300ETF对比" style="width:100%;height:auto">'+g+'<polyline fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3" points="'+pl(b)+'"/><polyline fill="none" stroke="var(--accent)" stroke-width="2.2" points="'+pl(a)+'"/></svg><div class="legend"><span style="color:var(--accent)">━ 账户</span><span>┅ 沪深300ETF</span><span>起点＝100</span></div>'}
const el=document.getElementById("vcp"),V=window.VCP;
if(!V||!V.state){el.innerHTML='<h1>小小白·VCP突破模拟账户</h1><div class="bar"><span class="pill warn">暂无数据</span><span>Mac 上的 VCP 账户还没有运行过，或数据文件尚未上传。</span></div>';}
else{
const s=V.state,nav=V.nav||[],last=nav[nav.length-1]||{},r=+last.ret||0,br=+last.bench_ret||0,dd=+last.dd||0,nv=last.nav?+last.nav:+s.cash;
const runs=V.runs||[],lr=runs[runs.length-1],st={ok:"成功",idle:"非交易日",failed:"失败"};
const T=V.tiers||{},L=T.list||[],C=T.count||{},pos=s.positions||[],orders=(s.plan&&s.plan.orders)||[];
const sec=(title,body,sub)=>'<section class="card"><div class="head"><h2>'+title+'</h2>'+(sub?'<span class="muted small">'+sub+'</span>':'')+'</div>'+body+'</section>';
const fold=(title,body)=>'<section class="card fold"><details><summary>'+title+'</summary><div class="fb">'+body+'</div></details></section>';
const tierName={1:"一档",2:"二档",3:"三档",4:"缺数据"};
let h='<header class="vh"><div><h1>小小白·VCP突破模拟账户</h1><p class="muted small">纯模拟交易，不连接券商 · 初始 '+f2(V.initial_cash)+' 元</p></div><div class="vpills"><span class="pill">结算至 '+esc(s.last_settled||"—")+'</span>'+(lr?'<span class="pill '+(lr.status=="failed"?"bad":lr.status=="ok"?"ok":"warn")+'">'+(st[lr.status]||esc(lr.status))+'</span>':'')+(s.market_ok===false?'<span class="pill warn">弱市：风险减半·最多2只</span>':'<span class="pill ok">强市</span>')+'</div></header>';
h+='<section class="card hero"><div class="hnav"><span>净资产</span><b>'+f2(nv)+'</b><em class="'+cls(r)+'">'+pct(r)+'</em></div><div class="kv"><div><span>沪深300ETF</span><b class="'+cls(br)+'">'+pct(br)+'</b></div><div><span>超额</span><b class="'+cls(r-br)+'">'+pct(r-br)+'</b></div><div><span>当前回撤</span><b>'+(dd*100).toFixed(2)+'%</b></div><div><span>持仓</span><b>'+pos.length+' 只</b></div><div><span>现金</span><b>'+f2(s.cash)+'</b></div></div>'+chart(nav)+'</section>';
let plan=orders.length?'<ul class="plan">'+orders.map(o=>o.side=="买入"?'<li><b class="pos">买入</b> '+esc(o.name||o.code)+' '+esc(o.shares)+' 股 · 开盘价 ≤ '+esc(o.max_buy||"")+' 时成交 · 止损 '+esc(o.stop)+' · 枢轴 '+esc(o.pivot)+'</li>':'<li><b class="neg">卖出</b> '+esc(o.name||o.code)+' 全部 · '+esc(o.reason)+'</li>').join("")+'</ul>':'<p>下一交易日<b>不下单</b>。'+(C[1]?'有 '+C[1]+' 只离突破 3% 以内，收盘放量越过枢轴即出信号。':'观察池中暂时没有临近突破的形态。')+'</p>';
h+=sec('下一交易日计划',plan,'冻结于 '+esc(s.plan&&s.plan.frozen_at||"—"));
if(pos.length)h+=sec('持仓','<div class="tw"><table><tr><th>股票</th><th>股数</th><th>成本</th><th>现价</th><th>止损</th><th>盈亏</th></tr>'+pos.map(p=>'<tr><td>'+esc(p.name||p.code)+'</td><td>'+esc(p.shares)+'</td><td>'+esc(p.entry)+'</td><td>'+esc(p.last)+'</td><td>'+esc(p.stop)+'</td><td class="'+cls(p.last/p.entry-1)+'">'+pct(p.last/p.entry-1,1)+'</td></tr>').join("")+'</table></div>');
const chip=t=>'<span class="tc t'+t+'">'+tierName[t]+'</span>';
const nice=t=>String(t||'').replace(/\(<(\d+)\)/g,'（需≥$1）').replace(/\(([\d.]+)\)/g,'（量比$1）').replace(/、/g,'；');
const row=x=>'<li class="rk t'+x.tier+(x.strong?' strong':'')+'"'+(x.rank>20?' data-more hidden':'')+'><span class="no">'+x.rank+'</span><div class="nm"><b>'+esc(x.name)+'</b><small>'+esc(x.code)+'</small></div><div class="ms"><span>'+(x.close==null?'—':esc(x.close))+(x.chg==null?'':' <i class="'+cls(x.chg)+'">'+(x.chg>0?'+':'')+x.chg+'%</i>')+'</span><small>半年 '+(x.ret26==null?'—':(x.ret26>0?'+':'')+x.ret26+'%')+'</small></div>'+chip(x.tier)+'<p class="st">'+esc(nice(x.status))+(x.pivot?' · 枢轴 '+esc(x.pivot)+' · 止损 '+esc(x.stop)+'（'+esc(x.stop_pct)+'%）· 收缩 '+esc((x.depth||[]).join('→'))+'%':'')+'</p></li>';
const sumBar='<div class="tsum"><div class="t1"><b>'+(C[1]||0)+'</b><span>一档·临近突破</span></div><div class="t2"><b>'+(C[2]||0)+'</b><span>二档·正在收缩</span></div><div class="t3"><b>'+(C[3]||0)+'</b><span>三档·未成形</span></div></div>';
const filt='<div class="flt" role="group" aria-label="筛选"><button data-f="all" aria-pressed="true">全部</button><button data-f="t12">一二档</button><button data-f="strong">强势延续</button></div>';
h+=sec('观察池排名',sumBar+filt+(L.length?'<ol class="rank">'+L.map(row).join("")+'</ol>'+(L.length>20?'<button class="more" type="button">展开全部 '+L.length+' 只</button>':''):'<p class="muted">暂无观察池数据</p>')+'<p class="muted small">'+esc(T.note||'')+'</p>','共 '+L.length+' 只 · 行情 '+esc(T.asof||"")+' · 筛选 '+esc((s.watchlist_date||"").slice(0,10)));
h+=fold('最新盘后报告'+(V.report?'（'+esc(V.report.name.replace(".md",""))+'）':''),'<div class="md">'+(V.report?md(V.report.text):'<p class="muted">暂无</p>')+'</div>');
const tr=(V.trades||[]).slice().reverse();
h+=fold('全部成交（'+tr.length+' 笔）',tr.length?'<div class="tw"><table><tr><th>日期</th><th>股票</th><th>方向</th><th>价格</th><th>股数</th><th>费用</th><th>原因</th></tr>'+tr.map(t=>'<tr><td>'+esc(t.date)+'</td><td>'+esc(t.name)+'</td><td class="'+(t.side=="买入"?"pos":"neg")+'">'+esc(t.side)+'</td><td>'+esc(t.price)+'</td><td>'+esc(t.shares)+'</td><td>'+esc(t.fee)+'</td><td style="text-align:left">'+esc(t.reason)+'</td></tr>').join("")+'</table></div>':'<p class="muted">暂无成交。</p>');
const BT=V.backtest,BP=V.bt_progress;
{let b='';if(BP)b+='<p class="muted small">回测数据：已下载 '+esc(BP.have)+' / '+esc(BP.total)+' 只（'+esc(BP.stop)+'，'+esc(BP.run_at)+'）</p><div class="prog"><i style="width:'+Math.min(100,BP.have/BP.total*100).toFixed(1)+'%"></i></div>';
if(BT){b+='<div class="tw"><table><tr><th>识别方法</th><th>可成交</th><th>胜率</th><th>平均R</th><th>持有天数</th><th>期末净值</th><th>最大回撤</th><th>同期沪深300</th></tr>';for(const k of Object.keys(BT)){const x=BT[k];if(!x||typeof x!=='object'||!x['识别方法'])continue;b+='<tr><td>'+esc(x['识别方法'])+'</td><td>'+esc(x['可成交笔数'])+'</td><td>'+(x['胜率']==null?'—':(x['胜率']*100).toFixed(0)+'%')+'</td><td>'+esc(x['平均R'])+'</td><td>'+esc(x['平均持有天数'])+'</td><td>'+f2(x['组合期末净值'])+'</td><td>'+(x['组合最大回撤']*100).toFixed(1)+'%</td><td>'+(x['基准区间涨跌']==null?'—':pct(x['基准区间涨跌']))+'</td></tr>'}b+='</table></div>'}else b+='<p class="muted small">数据下完后自动回测，结果显示在这里。</p>';h+=fold('历史回测',b);}
if(V.weekly)h+=fold('周度趋势筛选（'+esc(V.weekly.name.replace("weekly-","").replace(".md",""))+'）','<div class="md">'+md(V.weekly.text)+'</div>');
h+=fold('运行记录',runs.length?'<div class="tw"><table><tr><th>时间</th><th>状态</th><th>说明</th></tr>'+runs.slice().reverse().slice(0,15).map(x=>'<tr><td>'+esc(x.ts_bj.slice(5))+'</td><td class="'+(x.status=="failed"?"bad":x.status=="ok"?"ok":"warn")+'">'+(st[x.status]||esc(x.status))+'</td><td style="white-space:normal;text-align:left">'+esc(x.note)+'</td></tr>').join("")+'</table></div>':'<p class="muted">暂无</p>');
h+=fold('规则摘要（'+esc((V.rules_version||"").split("（")[0])+'）','<div class="md"><ul><li>选股：全市场沪深主板＋创业板，周线趋势模板（价&gt;10/30/40周线、40周线上行、距52周高≤25%、高于52周低30%、半年强于沪深300），每周五更新。</li><li>形态：近65日高点后整理10~65天；按波段高低点找收缩，右侧至少2次逐级缩小，首段≤35%、末段≤10%；最近5日均量≤50日均量×0.8；枢轴＝末次收缩高点，止损＝末次收缩低点（≤8%）。</li><li>信号：收盘放量≥1.5倍50日均量、收盘在枢轴至枢轴×1.03之间；次日开盘成交，高开超3%或跌回枢轴下放弃。</li><li>风控：单笔风险1%（弱市0.5%、最多2只），单股≤25%，最多5只，总仓≤90%；回撤10%风险减半，15%暂停。</li><li>卖出：触及止损；2R卖1/3并移止损到成本；买入3日内跌回枢轴；持有5天后破20日线；30天未达1R。</li><li>费用：佣金万3最低5元、过户费万0.1、卖出印花税万5、双边滑点0.1%。</li></ul></div>');
el.innerHTML=h;
const mb=el.querySelector('.more');if(mb)mb.addEventListener('click',()=>{el.querySelectorAll('.rank li[data-more]').forEach(li=>li.hidden=false);mb.remove()});
el.querySelectorAll('.flt button').forEach(b=>b.addEventListener('click',()=>{if(mb&&mb.isConnected)mb.remove();el.querySelectorAll('.flt button').forEach(x=>x.setAttribute('aria-pressed',x===b));const f=b.dataset.f;el.querySelectorAll('.rank li').forEach(li=>{li.hidden=f=='all'?false:f=='t12'?!(li.classList.contains('t1')||li.classList.contains('t2')):!li.classList.contains('strong')})}));
}
const views={app:document.getElementById("app"),vcp:el},links=document.querySelectorAll(".tabs a");
function show(){const v=location.hash==="#vcp"?"vcp":"app";for(const k in views)views[k].hidden=(k!==v);links.forEach(a=>{if(a.dataset.view===v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});window.scrollTo(0,0)}
window.addEventListener("hashchange",show);show();
})();
</script>
